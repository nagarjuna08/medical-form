
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}MediCare{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="bg-info text-white py-3 px-4 d-flex justify-content-between align-items-center shadow">
        <h2 class="m-0">MediCare</h2>

        <div>
        {% if user.is_authenticated %}
            <span class="me-2">Hello,{{ user.username }}</span>
            <a href="{% url 'doctor_logout' %}" class="btn btn-danger rounded-pill px-4">
                Logout
            </a>
        {% else %}
            <a href="{% url 'doctor_login' %}" class="btn btn-primary rounded-pill px-4">
                Doctor Login
            </a>
        {% endif %}
    </div>
    </div>
    <div class="container mt-4">
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-success text-center">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
